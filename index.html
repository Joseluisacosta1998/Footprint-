<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hyperliquid Footprint · ATAS style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11; --panel:#11151c; --panel2:#161b23; --line:#1e242e;
    --text:#dbe1e8; --muted:#6b7480;
    --bid:#2fbf71; --ask:#e8465c;
    --bid-dim:rgba(47,191,113,0.14); --ask-dim:rgba(232,70,92,0.14);
    --accent:#ffa94d; --poc:#3aa0ff; --imb:#2dd4bf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    overflow:hidden; overscroll-behavior:none; position:fixed; inset:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #app{ display:flex; flex-direction:column; height:100%; width:100%; }

  /* ---- Toolbar: 2 filas fijas, sin scroll horizontal (mobile-first) ---- */
  .topbar{ background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; position:relative; z-index:25; }
  .tb-row{ display:flex; align-items:center; gap:5px; padding:4px 6px; }
  .tb-row+.tb-row{ padding-top:0; }
  .coin-btn{
    display:flex; align-items:center; gap:5px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:12px; flex-shrink:0; cursor:pointer; user-select:none; white-space:nowrap;
  }
  .coin-btn .chev{ color:var(--muted); font-size:9px; }
  .coin-btn.open{ border-color:var(--accent); color:var(--accent); }
  .coin-btn.open .chev{ color:var(--accent); }

  #coinPanel{
    display:none; position:absolute; top:100%; left:6px; width:280px; max-width:calc(100vw - 12px);
    background:var(--panel); border:1px solid var(--line); border-radius:10px; z-index:30;
    box-shadow:0 14px 40px rgba(0,0,0,.55); overflow:hidden; max-height:min(70vh,420px);
    flex-direction:column;
  }
  #coinPanel.open{ display:flex; }
  .coin-panel-head{ padding:8px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .coin-panel-head input{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--text);
    padding:7px 9px; font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none;
  }
  .coin-panel-head input::placeholder{ color:var(--muted); }
  .coin-panel-cols{
    display:grid; grid-template-columns:22px 1fr 74px 62px; padding:6px 10px; font-size:9px; color:var(--muted);
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .coin-panel-cols span:nth-child(3), .coin-panel-cols span:nth-child(4){ text-align:right; }
  .coin-list{ overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain; }
  .coin-row{
    display:grid; grid-template-columns:22px 1fr 74px 62px; align-items:center; padding:8px 10px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.03);
  }
  .coin-row:active, .coin-row:hover{ background:var(--panel2); }
  .coin-row.sel{ background:rgba(255,169,77,0.08); }
  .coin-row .star{ font-size:14px; color:var(--muted); text-align:center; line-height:1; padding:2px; }
  .coin-row .star.fav{ color:var(--accent); }
  .coin-row .sym{ font-weight:700; color:var(--text); }
  .coin-row .px{ text-align:right; color:var(--text); }
  .coin-row .chg{ text-align:right; font-weight:600; }
  .coin-row .chg.up{ color:var(--bid); } .coin-row .chg.down{ color:var(--ask); }
  .coin-fav-sep{ padding:5px 10px; font-size:9px; color:var(--muted); font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid rgba(255,255,255,0.03); }
  .coin-empty{ padding:16px; text-align:center; color:var(--muted); font-size:11px; font-family:'IBM Plex Mono',monospace; }
  .chg24-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; padding:2px 6px; border-radius:5px; flex-shrink:0;
  }
  .chg24-badge.up{ color:var(--bid); background:var(--bid-dim); }
  .chg24-badge.down{ color:var(--ask); background:var(--ask-dim); }
  .tf-group{ display:flex; gap:1px; background:var(--panel2); border-radius:6px; padding:2px; flex-shrink:1; overflow:hidden; }
  .tf-btn{
    padding:5px 6px; font-size:11px; color:var(--muted); border-radius:5px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; user-select:none; white-space:nowrap;
  }
  .tf-btn.active{ background:var(--line); color:var(--accent); }
  .toolicons{ display:flex; gap:4px; flex-shrink:0; }
  .toolicons .ic{
    width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:13px; cursor:pointer; border:1px solid var(--line); color:var(--muted); background:var(--panel2);
    user-select:none; flex-shrink:0;
  }
  .toolicons .ic.active{ color:var(--accent); border-color:var(--accent); }
  .auto-badge{
    display:flex; align-items:center; gap:4px; padding:5px 7px; border-radius:6px;
    background:var(--panel2); border:1px solid var(--line); font-size:10px; color:var(--muted);
    font-family:'IBM Plex Mono',monospace; cursor:pointer; flex-shrink:0; white-space:nowrap;
  }
  .auto-badge .dot{ width:6px;height:6px;border-radius:50%; background:var(--muted); flex-shrink:0; }
  .auto-badge.on .dot{ background:var(--bid); box-shadow:0 0 6px var(--bid); }
  .status-dot{ width:7px;height:7px;border-radius:50%; background:var(--muted); flex-shrink:0; }
  .status-dot.ok{ background:var(--bid); } .status-dot.err{ background:var(--ask); }
  .price-live{ font-size:14px; font-weight:700; margin-left:auto; flex-shrink:0; }
  .price-live.up{ color:var(--bid); } .price-live.down{ color:var(--ask); }
  .spacer{ flex:1; min-width:2px; }

  .layout{ display:flex; flex:1; min-height:0; }
  .chartwrap{ flex:1; position:relative; overflow:hidden; min-width:0; touch-action:none; }
  #chartCanvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #chartCanvas.grabbing{ cursor:grabbing; }
  .footer-axis{ height:22px; background:var(--panel); border-top:1px solid var(--line); position:relative; overflow:hidden; flex-shrink:0; }

  .crosshair-price{
    position:absolute; right:0; padding:2px 8px; font-size:11px; font-family:'IBM Plex Mono',monospace;
    background:#ffffff; color:#0a0c11; font-weight:700; border-radius:3px 0 0 3px; z-index:6; pointer-events:none; display:none;
  }
  .crosshair-time{
    position:absolute; bottom:0; padding:2px 6px; font-size:10px; font-family:'IBM Plex Mono',monospace;
    background:#ffffff; color:#0a0c11; font-weight:700; border-radius:3px 3px 0 0; z-index:6; pointer-events:none; display:none;
  }

  .dom{ width:160px; min-width:160px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .dom.collapsed{ display:none; }
  .dom-head{ padding:6px 8px; font-size:10px; color:var(--muted); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; }
  .dom-body{ flex:1.3; overflow-y:auto; position:relative; }
  .dom-body::-webkit-scrollbar{ width:3px; }
  .dom-row{ display:grid; grid-template-columns:1fr 48px 1fr; align-items:center; height:18px; font-size:10.5px; font-family:'IBM Plex Mono',monospace; position:relative; }
  .dom-row .bidv, .dom-row .askv{ z-index:2; padding:0 6px; }
  .dom-row .bidv{ text-align:right; color:var(--bid); } .dom-row .askv{ text-align:left; color:var(--ask); }
  .dom-row .px{ text-align:center; color:var(--text); z-index:2; background:var(--panel); }
  .dom-row .bar{ position:absolute; top:1px; bottom:1px; z-index:1; }
  .dom-row .bar.bidbar{ right:48px; background:var(--bid-dim); } .dom-row .bar.askbar{ left:48px; background:var(--ask-dim); }
  .dom-row.mkt .px{ background:var(--accent); color:#1a1200; font-weight:700; }

  .tape{ flex:1; border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .tape-head{ padding:5px 8px; font-size:10px; color:var(--muted); font-family:'IBM Plex Mono',monospace; border-bottom:1px solid var(--line);}
  .tape-body{ flex:1; overflow-y:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; }
  .tape-body::-webkit-scrollbar{ width:3px; }
  .tape-row{ display:flex; justify-content:space-between; padding:1px 8px; }
  .tape-row.buy{ color:var(--ask); } .tape-row.sell{ color:var(--bid); } .tape-row .t{ color:var(--muted); }

  .dom-foot{ padding:6px 8px; border-top:1px solid var(--line); font-size:10px; font-family:'IBM Plex Mono',monospace; }
  .ratio{ display:flex; height:12px; border-radius:4px; overflow:hidden; margin-top:4px;}
  .ratio .b{ background:var(--bid); } .ratio .s{ background:var(--ask); }
  .stat-row{ display:flex; justify-content:space-between; color:var(--muted); margin-top:3px;}
  .stat-row span.v{ color:var(--text); }

  .loading-overlay{
    position:absolute; inset:0; background:rgba(10,12,17,0.75); display:flex; align-items:center; justify-content:center;
    z-index:20; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); pointer-events:none;
  }
  .hidden{ display:none !important; }

  /* ---- Panel de zonas de liquidez (liq map) ---- */
  #liqPanel{
    display:none; position:absolute; top:100%; right:6px; width:250px; max-width:calc(100vw - 12px);
    background:var(--panel); border:1px solid var(--line); border-radius:10px; z-index:30;
    box-shadow:0 14px 40px rgba(0,0,0,.55); overflow:hidden; max-height:min(78vh,380px); overflow-y:auto;
    touch-action:pan-y; overscroll-behavior:contain;
  }
  #liqPanel.open{ display:block; }
  .liq-sec{ padding:10px 12px; border-bottom:1px solid var(--line); }
  .liq-sec:last-child{ border-bottom:none; }
  .liq-sec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .liq-sec-title{ font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text); }
  .liq-toggle{ position:relative; width:32px; height:18px; border-radius:10px; background:var(--panel2);
    border:1px solid var(--line); cursor:pointer; flex-shrink:0; transition:all .15s; }
  .liq-toggle::after{ content:''; position:absolute; width:12px; height:12px; border-radius:50%;
    background:var(--muted); top:2px; left:2px; transition:all .15s; }
  .liq-toggle.on{ background:rgba(58,160,255,.25); border-color:var(--poc); }
  .liq-toggle.on::after{ left:16px; background:var(--poc); }
  .liq-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .liq-chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; background:var(--panel2);
    border:1px solid var(--line); border-radius:7px; font-family:'IBM Plex Mono',monospace; font-size:10px;
    font-weight:700; color:var(--muted); cursor:pointer; transition:all .15s; user-select:none; }
  .liq-chip i{ width:7px; height:7px; border-radius:2px; display:inline-block; border:1.5px dashed currentColor; flex-shrink:0; }
  .liq-chip.active{ color:var(--chip-color,var(--poc)); border-color:var(--chip-color,var(--poc)); background:var(--chip-bg,rgba(58,160,255,.12)); }
  .liq-chip.active i{ background:var(--chip-color,var(--poc)); border-style:solid; }
  .liq-slider-row{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); }
  .liq-slider-row input[type=range]{ flex:1; accent-color:var(--poc); }
  .liq-slider-row .rval{ width:32px; text-align:right; color:var(--text); }

  /* ---- Crosshair estilo TradingView: líneas discontinuas sobre el canvas ---- */
  .crosshair-price, .crosshair-time{ background:var(--accent); color:#1a1200; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="tb-row">
      <div class="coin-btn mono" id="coinBtn"><span id="coinBtnSym">LIT</span><span class="chev">▾</span></div>
      <div class="tf-group" id="tfGroup">
        <div class="tf-btn" data-tf="1m">1m</div>
        <div class="tf-btn active" data-tf="5m">5m</div>
        <div class="tf-btn" data-tf="15m">15m</div>
        <div class="tf-btn" data-tf="1h">1H</div>
        <div class="tf-btn" data-tf="4h">4H</div>
      </div>
      <div class="spacer"></div>
      <span class="status-dot ok" id="statusDot"></span>
      <span class="chg24-badge mono" id="chg24Badge">--</span>
      <div class="price-live up mono" id="livePrice">--</div>
    </div>
    <div id="coinPanel">
      <div class="coin-panel-head"><input id="coinSearch" type="text" placeholder="Buscar activo…" autocomplete="off"></div>
      <div class="coin-panel-cols"><span></span><span>Activo</span><span>Precio</span><span>24h</span></div>
      <div class="coin-list" id="coinList"></div>
    </div>
    <div class="tb-row">
      <div class="toolicons">
        <div class="ic active" id="btnCrosshair" title="Crosshair">✛</div>
        <div class="ic" id="btnFit" title="Restablecer vista">⤢</div>
        <div class="ic" id="btnRefresh" title="Actualizar ahora">↻</div>
        <div class="ic active" id="btnPanelToggle" title="Mostrar/ocultar order book">▤</div>
        <div class="ic active" id="btnLiq" title="Zonas de liquidación" style="position:relative;">💧</div>
      </div>
      <div class="spacer"></div>
      <div class="auto-badge on" id="autoBadge"><span class="dot"></span><span id="autoLabel">60s</span></div>
    </div>
    <div id="liqPanel">
      <div class="liq-sec">
        <div class="liq-sec-head">
          <span class="liq-sec-title">Zonas de liquidación</span>
          <div class="liq-toggle" id="liqToggle"></div>
        </div>
        <div class="liq-chip-row" id="liqLevChips"></div>
        <div class="liq-slider-row">
          <span>Umbral</span>
          <input type="range" id="liqThreshold" min="10" max="90" step="1" value="50">
          <span class="rval" id="liqThresholdVal">0.50</span>
        </div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="chartwrap" id="chartwrap">
      <div class="loading-overlay" id="loadingOverlay">Cargando velas de Hyperliquid…</div>
      <div class="crosshair-price" id="crosshairPrice"></div>
      <div class="crosshair-time" id="crosshairTime"></div>
      <canvas id="chartCanvas"></canvas>
      <div class="footer-axis" id="timeAxis"></div>
    </div>

    <div class="dom" id="domPanel">
      <div class="dom-head"><span>DOM</span><span>Bid / Ask</span></div>
      <div class="dom-body" id="domBody"></div>
      <div class="tape">
        <div class="tape-head">Ejecuciones en vivo</div>
        <div class="tape-body" id="tapeBody"></div>
      </div>
      <div class="dom-foot">
        <div class="stat-row"><span>Spread</span><span class="v" id="spreadVal">--</span></div>
        <div class="stat-row"><span>Delta vela</span><span class="v" id="deltaVal">--</span></div>
        <div class="ratio"><div class="b" id="ratioB" style="width:50%"></div><div class="s" id="ratioS" style="width:50%"></div></div>
        <div class="stat-row"><span id="ratioBLabel">B 50%</span><span id="ratioSLabel">50% S</span></div>
      </div>
    </div>
  </div>
</div>

<script>
try{

const state = {
  coin:'LIT', interval:'5m',
  candleMap:new Map(), candles:[],
  footprint:{}, footprintEstimated:{},
  book:{bids:[], asks:[]},
  ws:null, wsReady:false,
  autoRefresh:true, refreshMs:60000, countdown:60,
  offsetPx:0, priceShift:0, priceScale:1, candleW:76,
  crosshairOn:true, panelOpen:true,
  lastPrice:null, prevPrice:null, tape:[],
  liqOn:true, liqLevs:[10,25,50,100], liqThreshold:0.50, liqModel:null, liqPanelOpen:false,
  assetList:[], change24h:null, coinPanelOpen:false, coinSearch:'',
  favorites: (function(){ try{ return JSON.parse(localStorage.getItem('hl_fav_coins')||'[]'); }catch(e){ return []; } })(),
  crosshairPt:null,
};
const INTERVAL_MS = { '1m':60000,'5m':300000,'15m':900000,'1h':3600000,'4h':14400000 };
const IMB_RATIO = 2.2, IMB_MIN_SHARE = 0.30;

/* ============ Zonas de liquidez (liq map) — mismo modelo que chart-panel ============ */
const LEVERAGE_TIERS = [
  {lev:10,  color:'#3b82f6', share:.35},
  {lev:25,  color:'#00e5a0', share:.30},
  {lev:50,  color:'#f5a623', share:.20},
  {lev:100, color:'#ff7a1a', share:.15},
];
const LIQ_SCALE = 0.002;

function buildLiquidityModel(cds, numBuckets, activeLevs){
  activeLevs = activeLevs && activeLevs.length ? activeLevs : [10,25,50,100];
  const activeTiers = LEVERAGE_TIERS.filter(t=>activeLevs.includes(t.lev));
  if(!activeTiers.length || !cds.length) return null;
  const lastClose = cds[cds.length-1].close;
  const lows = cds.map(c=>c.low), highs = cds.map(c=>c.high);
  const minLowLev = lastClose*(1-1/LEVERAGE_TIERS[0].lev*1.6);
  const maxHighLev = lastClose*(1+1/LEVERAGE_TIERS[0].lev*1.6);
  const lo = Math.min(Math.min(...lows), minLowLev);
  const hi = Math.max(Math.max(...highs), maxHighLev);
  const N = numBuckets||130;
  const step = (hi-lo)/N;
  if(!(step>0)) return null;
  const buckets = Array.from({length:N},(_,i)=>({
    lo: lo+i*step, hi: lo+(i+1)*step, mid: lo+(i+0.5)*step,
    tiers:{}, longTotal:0, shortTotal:0, total:0, firstTime:null, contributions:[],
  }));
  function bucketIndex(p){
    if(!(p>lo) || !(p<hi)) return -1;
    let idx=Math.floor((p-lo)/step);
    if(idx<0) idx=0; if(idx>=N) idx=N-1;
    return idx;
  }
  cds.forEach(c=>{
    const notional = c.volume*c.close;
    const range = c.high - c.low;
    const subSteps = Math.min(40, Math.max(1, Math.round(range/step*2)));
    activeTiers.forEach(tier=>{
      for(let s=0;s<=subSteps;s++){
        const t = s/Math.max(1,subSteps);
        const entryPrice = c.low + t*range;
        const longLiq  = entryPrice*(1-1/tier.lev);
        const shortLiq = entryPrice*(1+1/tier.lev);
        const amt = (notional*tier.share*0.5*LIQ_SCALE)/(subSteps+1);
        let bi=bucketIndex(longLiq);
        if(bi>=0){
          const b=buckets[bi];
          b.tiers[tier.lev]=(b.tiers[tier.lev]||0)+amt;
          b.longTotal+=amt; b.total+=amt;
          if(b.firstTime==null) b.firstTime=c.t;
          b.contributions.push({time:c.t, amt});
        }
        bi=bucketIndex(shortLiq);
        if(bi>=0){
          const b=buckets[bi];
          b.tiers[tier.lev]=(b.tiers[tier.lev]||0)+amt;
          b.shortTotal+=amt; b.total+=amt;
          if(b.firstTime==null) b.firstTime=c.t;
          b.contributions.push({time:c.t, amt});
        }
      }
    });
  });
  const maxIntensity = Math.max(1, ...buckets.map(b=>b.total));
  return {buckets, maxIntensity, lo, hi, step, lastClose};
}
function detectPools(buckets, maxIntensity, thresholdFrac){
  const thr = maxIntensity*thresholdFrac;
  const pools=[]; let run=null;
  buckets.forEach((b,i)=>{
    if(b.total>=thr){
      if(!run) run={start:i,end:i,maxTotal:b.total};
      else { run.end=i; run.maxTotal=Math.max(run.maxTotal,b.total); }
    } else if(run){ pools.push(run); run=null; }
  });
  if(run) pools.push(run);
  return pools;
}
function computeSweepEvents(buckets, cds){
  const result = new Map();
  const wasInside = new Array(buckets.length).fill(false);
  for(let ci=1; ci<cds.length; ci++){
    const prevClose = cds[ci-1].close;
    const candle = cds[ci];
    const lo=Math.min(candle.low, prevClose), hi=Math.max(candle.high, prevClose);
    buckets.forEach((b,bi)=>{
      if(b.total<=0) return;
      if(b.firstTime==null || candle.t<=b.firstTime){ wasInside[bi]=false; return; }
      const inside=(b.mid>=lo && b.mid<=hi);
      if(inside && !wasInside[bi]){
        if(!result.has(bi)) result.set(bi, []);
        result.get(bi).push(candle.t);
      }
      wasInside[bi]=inside;
    });
  }
  return result;
}
function sumContribInWindow(b, fromExclusive, toInclusive){
  let s=0;
  for(const c of b.contributions){ if(c.time>fromExclusive && c.time<=toInclusive) s+=c.amt; }
  return s;
}
function buildBucketSegments(b, sweepTimes, nowMs){
  const bounds=[b.firstTime, ...(sweepTimes||[]), nowMs];
  const segments=[];
  for(let k=0;k<bounds.length-1;k++){
    const segFrom = k===0 ? -Infinity : bounds[k];
    const segTo = bounds[k+1];
    if(segTo<=bounds[k] && k>0) continue;
    const amt = sumContribInWindow(b, segFrom, segTo);
    segments.push({ from: k===0 ? b.firstTime : bounds[k], to: segTo, amt,
      isActive: k===bounds.length-2, isNew: k>0 });
  }
  return segments;
}
function intensityColor(frac, alpha){
  frac = Math.max(0, Math.min(1, frac));
  const QUANT_STEPS=7;
  frac = Math.round(frac*QUANT_STEPS)/QUANT_STEPS;
  const colors=[[0,[40,20,70]],[0.3,[19,180,160]],[0.6,[245,230,35]],[1,[255,80,80]]];
  let c0=colors[0], c1=colors[colors.length-1];
  for(let i=0;i<colors.length-1;i++){
    if(frac>=colors[i][0] && frac<=colors[i+1][0]){ c0=colors[i]; c1=colors[i+1]; break; }
  }
  const t=(frac-c0[0])/(c1[0]-c0[0]||1);
  const r=Math.round(c0[1][0]+(c1[1][0]-c0[1][0])*t);
  const g=Math.round(c0[1][1]+(c1[1][1]-c0[1][1])*t);
  const bl=Math.round(c0[1][2]+(c1[1][2]-c0[1][2])*t);
  return `rgba(${r},${g},${bl},${alpha==null?1:alpha})`;
}
function contrastFrac(frac, exp){ frac=Math.max(0,Math.min(1,frac)); return Math.pow(frac, exp==null?1.6:exp); }
function fmtUSDov(n){
  if(n==null) return '—';
  const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(2)+'B';
  if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1e3) return (n/1e3).toFixed(2)+'K';
  return n.toFixed(2);
}
function rebuildLiquidityModel(){
  const model = (state.liqOn && state.candles.length>5)
    ? buildLiquidityModel(state.candles, 130, state.liqLevs)
    : null;
  if(model){
    // Se calcula UNA sola vez por refresco (no en cada frame de paneo/zoom):
    // determina, para cada bucket, únicamente la acumulación ACTIVA desde el
    // último barrido (sweep) hasta ahora. Todo lo anterior a un barrido se
    // descarta por completo -> la zona liquidada desaparece del mapa y
    // empieza a acumularse de cero con los datos nuevos que vayan llegando.
    const candles = state.candles;
    const sweepMap = computeSweepEvents(model.buckets, candles);
    const lastTimeMs = candles[candles.length-1].t;
    model.lastTimeMs = lastTimeMs;
    model.active = model.buckets.map((b,bi)=>{
      if(b.total<=0) return {total:0, from:null, lastSweepTime:null};
      const sweeps = sweepMap.get(bi);
      const lastSweepTime = sweeps && sweeps.length ? sweeps[sweeps.length-1] : null;
      const from = lastSweepTime!=null ? lastSweepTime : b.firstTime;
      const total = sumContribInWindow(b, lastSweepTime!=null ? lastSweepTime : -Infinity, lastTimeMs);
      return {total, from, lastSweepTime};
    });
  }
  state.liqModel = model;
}

function fmt(n,d=4){ if(n==null||isNaN(n)) return '--'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtShort(n){
  if(n==null||isNaN(n)) return '0';
  const a = Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1e3) return (n/1e3).toFixed(1)+'k';
  return Math.round(n).toString();
}
function tickForPrice(p){ if(p>=1000) return 1; if(p>=100) return 0.1; if(p>=10) return 0.01; if(p>=1) return 0.001; if(p>=0.1) return 0.0001; return 0.00001; }
function setStatus(ok){ document.getElementById('statusDot').className='status-dot '+(ok?'ok':'err'); }
function rebuildCandlesArray(){ state.candles=[...state.candleMap.values()].sort((a,b)=>a.t-b.t); }

/* ============ REST Hyperliquid ============ */
async function hlPost(body){
  const res = await fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function fetchCandles(){
  const n=1000, ms=INTERVAL_MS[state.interval], endTime=Date.now(), startTime=endTime-n*ms;
  const data = await hlPost({type:'candleSnapshot', req:{coin:state.coin, interval:state.interval, startTime, endTime}});
  if(!Array.isArray(data)||data.length===0) throw new Error('Sin velas para '+state.coin);
  data.forEach(c=>{
    const existing = state.candleMap.get(c.t);
    const candle = {t:c.t, T:c.T, open:+c.o, high:+c.h, low:+c.l, close:+c.c, volume:+c.v};
    if(existing){ candle.high=Math.max(candle.high, existing.high); candle.low=Math.min(candle.low, existing.low); }
    state.candleMap.set(c.t, candle);
  });
  rebuildCandlesArray();
}
async function fetchBook(){
  const data = await hlPost({type:'l2Book', coin:state.coin});
  const [bidsRaw, asksRaw] = data.levels || data;
  state.book.bids = (bidsRaw||[]).slice(0,15).map(l=>({price:+l.px,size:+l.sz}));
  state.book.asks = (asksRaw||[]).slice(0,15).map(l=>({price:+l.px,size:+l.sz}));

async function fetchAssetCtxs(){
  const data = await hlPost({type:'metaAndAssetCtxs'});
  const meta = data[0], ctxs = data[1];
  const list = (meta.universe||[]).map((u,i)=>{
    const c = ctxs[i]||{};
    const price = +c.markPx || +c.oraclePx || 0;
    const prevPx = +c.prevDayPx || price;
    const change = prevPx ? (price-prevPx)/prevPx*100 : 0;
    const vol = +c.dayNtlVlm || 0;
    return {coin:u.name, price, change, vol};
  }).filter(a=>a.price>0);
  list.sort((a,b)=>b.vol-a.vol);
  state.assetList = list;
  const cur = list.find(a=>a.coin===state.coin);
  if(cur){
    state.change24h = cur.change;
    state.prevDayPx = cur.price/(1+cur.change/100);
    if(state.lastPrice==null) state.lastPrice = cur.price;
  }
  renderChg24Badge();

/* ============ WebSocket ejecuciones ============ */
function connectWS(){
  if(state.ws){ try{state.ws.close();}catch(e){} }
  state.wsReady=false;
  const ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
  state.ws = ws;
  ws.onopen = () => { state.wsReady=true; ws.send(JSON.stringify({method:'subscribe', subscription:{type:'trades', coin:state.coin}})); };
  ws.onmessage = (ev) => {
    try{ const msg=JSON.parse(ev.data); if(msg.channel==='trades' && Array.isArray(msg.data)) msg.data.forEach(handleTrade); }catch(e){}
  };
  ws.onclose = () => { state.wsReady=false; };
  ws.onerror = () => { state.wsReady=false; };
}
function handleTrade(tr){
  const price=+tr.px, size=+tr.sz, isBuyAggr = tr.side==='B';
  state.lastPrice = price; updateLivePrice();
  state.tape.unshift({price,size,time:tr.time||Date.now(),buy:isBuyAggr});
  if(state.tape.length>40) state.tape.length=40;
  renderTape();
  if(state.candles.length===0) return;
  const ms = INTERVAL_MS[state.interval];
  let last = state.candles[state.candles.length-1];
  let candle = (tr.time>=last.t && tr.time<last.t+ms) ? last : null;
  if(!candle){
    if(tr.time>=last.t+ms){
      const newT = last.t+ms;
      const nc = {t:newT, T:newT+ms, open:price, high:price, low:price, close:price, volume:0};
      state.candleMap.set(newT, nc); rebuildCandlesArray(); candle=nc;
    } else return;
  }
  candle.close=price; candle.high=Math.max(candle.high,price); candle.low=Math.min(candle.low,price); candle.volume+=size;
  if(!state.footprint[candle.t]) state.footprint[candle.t] = {tick:tickForPrice(price), levels:new Map()};
  const fp = state.footprint[candle.t];
  const bucket = Math.round(price/fp.tick)*fp.tick;
  const key = bucket.toFixed(8);
  if(!fp.levels.has(key)) fp.levels.set(key,{price:bucket,bid:0,ask:0});
  const lvl = fp.levels.get(key);
  if(isBuyAggr) lvl.ask+=size; else lvl.bid+=size;
  render();
}
function updateLivePrice(){
  const el = document.getElementById('livePrice');
  if(state.lastPrice==null) return;
  el.textContent = fmt(state.lastPrice, state.lastPrice<1?6:4);
  if(state.prevPrice!=null){ el.classList.toggle('up', state.lastPrice>=state.prevPrice); el.classList.toggle('down', state.lastPrice<state.prevPrice); }
  state.prevPrice = state.lastPrice;
  if(state.prevDayPx){ state.change24h = (state.lastPrice-state.prevDayPx)/state.prevDayPx*100; renderChg24Badge(); }
}

function estimateFootprint(candle){
  if(state.footprint[candle.t] && state.footprint[candle.t].levels.size>0) return {fp:state.footprint[candle.t], estimated:false};
  if(state.footprintEstimated[candle.t]) return {fp:state.footprintEstimated[candle.t], estimated:true};
  const tick = tickForPrice(candle.close);
  const top = Math.round(candle.high/tick)*tick;
  const bot = Math.round(candle.low/tick)*tick;
  const levels = new Map();
  let seed = Math.abs(candle.t) % 100000 + 7;
  function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
  const nLevels = Math.max(1, Math.round((top-bot)/tick)+1);
  const totalVol = candle.volume || 1;
  const bullish = candle.close>=candle.open;
  for(let p=bot, i=0; p<=top+1e-9 && i<200; p=+(p+tick).toFixed(8), i++){
    const w = 0.35+rnd()*0.9;
    const vol = (totalVol/nLevels)*w;
    const askShare = bullish ? 0.5+rnd()*0.22 : 0.28+rnd()*0.22;
    const ask = vol*askShare, bid = vol-ask;
    levels.set(p.toFixed(8), {price:p, bid, ask});
  }
  const fp = {tick, levels};
  state.footprintEstimated[candle.t] = fp;
  return {fp, estimated:true};
}

/* ============ Chart ============ */
const canvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('chartwrap');
const ROW_H=15, PAD_TOP=16;

function resizeCanvas(){
  const dpr = window.devicePixelRatio||1;
  canvas.width = wrap.clientWidth*dpr;
  canvas.height = (wrap.clientHeight-22)*dpr;
  canvas.style.width = wrap.clientWidth+'px';
  canvas.style.height = (wrap.clientHeight-22)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  render();
}
window.addEventListener('resize', ()=>{ stopInertia(); resizeCanvas(); });

function drawDiamond(cx,cy,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(cx, cy-r); ctx.lineTo(cx+r, cy); ctx.lineTo(cx, cy+r); ctx.lineTo(cx-r, cy);
  ctx.closePath(); ctx.fill();
}

let _timeToIdxCache=null, _timeToIdxCacheLen=-1, _timeToIdxCacheFirstT=null;
function computeGeometry(offsetPx, priceShift, priceScale, candleW){
  const candles = state.candles;
  const W = wrap.clientWidth, H = wrap.clientHeight-22;
  const baseline = H-8;
  if(candles.length===0) return null;
  const cw = candleW;
  const totalWidth = candles.length*cw;
  const rightEdge = W-16;
  const startX = rightEdge - totalWidth + offsetPx;
  let visLo=Infinity, visHi=-Infinity, visMaxVol=1;
  candles.forEach((c,idx)=>{
    const x = startX+idx*cw;
    if(x>-cw && x<W){ visLo=Math.min(visLo,c.low); visHi=Math.max(visHi,c.high); visMaxVol=Math.max(visMaxVol,c.volume); }
  });
  if(!isFinite(visLo)){ visLo=Math.min(...candles.map(c=>c.low)); visHi=Math.max(...candles.map(c=>c.high)); }
  const baseCenter = (visHi+visLo)/2 + priceShift;
  const baseHalf = Math.max((visHi-visLo)/2*1.1, visHi*0.0006) * priceScale;
  const pMax = baseCenter+baseHalf, pMin = baseCenter-baseHalf;
  const priceToY = p => PAD_TOP + (pMax-p)/(pMax-pMin) * (baseline-PAD_TOP);
  const yToPrice = y => pMax - (y-PAD_TOP)/(baseline-PAD_TOP) * (pMax-pMin);
  return {W,H,baseline,cw,startX,rightEdge,totalWidth,visLo,visHi,visMaxVol,pMax,pMin,priceToY,yToPrice};
}

function render(){
  const candles = state.candles;
  const W = wrap.clientWidth, H = wrap.clientHeight-22;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0c11'; ctx.fillRect(0,0,W,H);
  if(candles.length===0){ window._chartGeom=null; return; }

  const geom = computeGeometry(state.offsetPx, state.priceShift, state.priceScale, state.candleW);
  const {cw, startX, baseline, visMaxVol, pMax, pMin, priceToY} = geom;
  const dec = pMax<1?6:4;
  const step = (pMax-pMin)/8;

  ctx.strokeStyle='#161b22'; ctx.fillStyle='#6b7480'; ctx.font='10px IBM Plex Mono';
  for(let i=0;i<=8;i++){
    const p=pMin+i*step, y=priceToY(p);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    ctx.fillText(p.toFixed(dec), W-58, y-2);
  }

  // ── ZONAS DE LIQUIDEZ (liq map) — se dibujan de fondo, el footprint va encima ──
  const idxToX = idx => startX+idx*cw;
  const xNow = idxToX(candles.length-1)+cw;
  if(state.liqOn && state.liqModel && state.liqModel.active){
    if(_timeToIdxCacheLen!==candles.length || _timeToIdxCacheFirstT!==(candles[0] && candles[0].t)){
      _timeToIdxCache = new Map();
      candles.forEach((c,i)=>_timeToIdxCache.set(c.t,i));
      _timeToIdxCacheLen=candles.length; _timeToIdxCacheFirstT = candles[0] && candles[0].t;
    }
    const timeToIdx=_timeToIdxCache;
    function timeToX(t){
      if(t==null) return 0;
      if(timeToIdx.has(t)) return idxToX(timeToIdx.get(t));
      let lo=0, hi=candles.length-1, best=0;
      while(lo<=hi){ const mid=(lo+hi)>>1; if(candles[mid].t<t){ best=mid; lo=mid+1; } else hi=mid-1; }
      return idxToX(best);
    }
    const liqModel = state.liqModel;
    const thresholdFrac = state.liqThreshold;
    const lastTimeMs = liqModel.lastTimeMs;
    const intervalMs = INTERVAL_MS[state.interval] || 60000;
    const fadeWindow = intervalMs*15; // los marcadores "×" de barrido se desvanecen tras ~15 velas
    ctx.save();
    ctx.beginPath(); ctx.rect(0,PAD_TOP,W,baseline-PAD_TOP); ctx.clip();
    // Banda de intensidad ACTIVA por bucket (solo lo acumulado desde el último barrido)
    liqModel.buckets.forEach((b,bi)=>{
      const act = liqModel.active[bi];
      if(!act || act.total<=0) return;
      const frac = act.total/liqModel.maxIntensity;
      if(frac<thresholdFrac) return;
      const x0=Math.max(0,timeToX(act.from));
      if(xNow<=x0) return;
      const yTop=priceToY(b.hi), yBot=priceToY(b.lo);
      const cFrac=contrastFrac(frac);
      ctx.fillStyle=intensityColor(frac, 0.05+cFrac*0.55);
      ctx.fillRect(x0, Math.min(yTop,yBot), xNow-x0, Math.max(1,Math.abs(yBot-yTop)));
    });
    // Pools (concentraciones activas) con etiqueta de monto estimado
    const pools = detectPools(liqModel.active, liqModel.maxIntensity, thresholdFrac);
    pools.forEach(pool=>{
      const bTop=liqModel.buckets[pool.start], bBot=liqModel.buckets[pool.end];
      const yTop=priceToY(bTop.hi), yBot=priceToY(bBot.lo);
      const idxs=Array.from({length:pool.end-pool.start+1},(_,i)=>pool.start+i);
      const froms=idxs.map(i=>liqModel.active[i].from).filter(t=>t!=null);
      const firstT=froms.length?Math.min(...froms):candles[0].t;
      const x0=Math.max(0,timeToX(firstT)), x1=xNow;
      if(x1<=x0) return;
      const frac=pool.maxTotal/liqModel.maxIntensity;
      const isRecentlySwept = idxs.some(i=>{
        const st=liqModel.active[i].lastSweepTime;
        return st!=null && (lastTimeMs-st)<fadeWindow;
      });
      ctx.font='bold 8px IBM Plex Mono, monospace';
      ctx.fillStyle=intensityColor(frac,0.95);
      ctx.textAlign='left'; ctx.textBaseline='bottom';
      const lbl=(isRecentlySwept?'● NUEVA · ':'')+'$'+fmtUSDov(pool.maxTotal);
      ctx.fillText(lbl, x0+4, Math.min(yTop,yBot)-2);
    });
    // × marcando barridos recientes (se desvanecen y desaparecen con el tiempo)
    liqModel.buckets.forEach((b,bi)=>{
      const act=liqModel.active[bi];
      if(!act || act.lastSweepTime==null) return;
      const age = lastTimeMs-act.lastSweepTime;
      if(age<0 || age>=fadeWindow) return;
      const fadeAlpha = 1-(age/fadeWindow);
      const x=timeToX(act.lastSweepTime), y=priceToY(b.mid);
      ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${0.92*fadeAlpha})`; ctx.fill();
      ctx.strokeStyle=`rgba(255,255,255,${fadeAlpha})`; ctx.lineWidth=1.4; ctx.stroke();
      ctx.font='bold 8px sans-serif'; ctx.fillStyle=`rgba(10,10,15,${fadeAlpha})`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('×', x, y+0.5);
    });
    ctx.restore();
  }

  ctx.strokeStyle='#12161d';
  candles.forEach((c,idx)=>{ const x=startX+idx*cw; if(x>=-2&&x<=W){ ctx.beginPath(); ctx.moveTo(x,PAD_TOP); ctx.lineTo(x,baseline); ctx.stroke(); } });

  const volMaxH = (baseline-PAD_TOP)*0.14;
  candles.forEach((c, idx) => {
    const x = startX+idx*cw;
    if(x < -cw || x > W) return;
    const up = c.close>=c.open;
    const h = (c.volume/visMaxVol)*volMaxH;
    ctx.fillStyle = up ? 'rgba(47,191,113,0.16)' : 'rgba(232,70,92,0.16)';
    ctx.fillRect(x+2, baseline-h, cw-6, h);
  });

  // layout de columnas dentro de cada vela: [vela OHLC] [footprint] [delta]
  const stripW = Math.max(9, Math.min(16, cw*0.16));
  const gutterW = Math.max(7, Math.min(20, cw*0.16));
  const gap1=2, gap2=2;

  candles.forEach((c, idx) => {
    const x = startX+idx*cw;
    if(x < -cw || x > W) return;
    const isLastCandle = idx === candles.length-1;
    const {fp, estimated} = estimateFootprint(c);

    // ---- vela clásica (wick + cuerpo) siempre visible, al lado del footprint ----
    const stripCx = x + stripW/2 + 1;
    const up = c.close>=c.open;
    ctx.strokeStyle = up? '#2fbf71':'#e8465c';
    ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(stripCx, priceToY(c.high)); ctx.lineTo(stripCx, priceToY(c.low)); ctx.stroke();
    const yO=priceToY(c.open), yC=priceToY(c.close);
    ctx.fillStyle = up? '#2fbf71':'#e8465c';
    const bodyW = Math.max(3, stripW*0.7);
    ctx.fillRect(stripCx-bodyW/2, Math.min(yO,yC), bodyW, Math.max(1,Math.abs(yC-yO)));

    const fpX = x + stripW + gap1;
    const fw = Math.max(6, cw - stripW - gutterW - gap1 - gap2 - 2);
    const cx = fpX + fw/2;

    if(fp && fp.levels.size>0){
      const levels = [...fp.levels.values()].sort((a,b)=>b.price-a.price);
      const maxLevelVol = Math.max(...levels.map(l=>l.bid+l.ask), 1);
      const poc = levels.reduce((a,b)=> (a.bid+a.ask)>(b.bid+b.ask)?a:b, levels[0]);
      const halfBar = fw/2*0.86;

      const flags = levels.map(l=>{
        const hi=Math.max(l.bid,l.ask), lo=Math.min(l.bid,l.ask);
        const ratio = hi/Math.max(lo,1);
        return (ratio>=IMB_RATIO && hi>=maxLevelVol*IMB_MIN_SHARE);
      });
      let runStart=-1;
      for(let i=0;i<=levels.length;i++){
        if(i<levels.length && flags[i]){ if(runStart<0) runStart=i; }
        else{
          if(runStart>=0 && i-runStart>=3){
            const yTop = priceToY(levels[runStart].price)-ROW_H/2;
            const yBot = priceToY(levels[i-1].price)+ROW_H/2;
            ctx.strokeStyle='#2dd4bf'; ctx.lineWidth=1.3;
            ctx.strokeRect(fpX+1, yTop, fw-2, yBot-yTop);
          }
          runStart=-1;
        }
      }

      levels.forEach((l,i)=>{
        const y = priceToY(l.price);
        const intensity = (l.bid+l.ask)/maxLevelVol;
        ctx.fillStyle = `rgba(58,160,255,${0.04+intensity*0.14})`;
        ctx.fillRect(fpX, y-ROW_H/2, fw, ROW_H-1);

        const bidLen = halfBar*(l.bid/maxLevelVol);
        const askLen = halfBar*(l.ask/maxLevelVol);
        ctx.fillStyle = 'rgba(47,191,113,0.30)'; ctx.fillRect(cx-bidLen, y-ROW_H/2+1, bidLen, ROW_H-3);
        ctx.fillStyle = 'rgba(232,70,92,0.30)'; ctx.fillRect(cx, y-ROW_H/2+1, askLen, ROW_H-3);

        if(l===poc){ ctx.strokeStyle='#3aa0ff'; ctx.lineWidth=1; ctx.strokeRect(fpX+0.5, y-ROW_H/2+0.5, fw-1, ROW_H-2); }

        if(cw>=46){
          const imb = flags[i];
          ctx.font = imb ? 'bold 10px IBM Plex Mono' : '9.5px IBM Plex Mono';
          ctx.fillStyle = imb && l.bid>l.ask ? '#5be89a' : '#2fbf71';
          ctx.textAlign='right'; ctx.fillText(fmtShort(l.bid), cx-3, y+3);
          ctx.font='9px IBM Plex Mono'; ctx.fillStyle='#4a5260'; ctx.textAlign='center'; ctx.fillText('×', cx, y+3);
          ctx.font = imb ? 'bold 10px IBM Plex Mono' : '9.5px IBM Plex Mono';
          ctx.fillStyle = imb && l.ask>l.bid ? '#ff6f82' : '#e8465c';
          ctx.textAlign='left'; ctx.fillText(fmtShort(l.ask), cx+3, y+3);
        }
      });

      if(isLastCandle && state.lastPrice){
        let nearest=levels[0], nd=Infinity;
        levels.forEach(l=>{ const d=Math.abs(l.price-state.lastPrice); if(d<nd){nd=d; nearest=l;} });
        const y = priceToY(nearest.price);
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.2; ctx.strokeRect(fpX+1, y-ROW_H/2+1, fw-2, ROW_H-3);
        drawDiamond(fpX-4, y, 3.2, '#2fbf71');
        drawDiamond(fpX+fw+4, y, 3.2, '#2fbf71');
      }

      const gutterX = fpX+fw+2;
      const maxAbsDelta = Math.max(...levels.map(l=>Math.abs(l.ask-l.bid)), 1);
      levels.forEach(l=>{
        const y=priceToY(l.price); const d=l.ask-l.bid;
        const len = gutterW*0.85*Math.abs(d)/maxAbsDelta;
        ctx.fillStyle = d>=0 ? 'rgba(47,191,113,0.55)' : 'rgba(232,70,92,0.55)';
        ctx.fillRect(gutterX, y-ROW_H/2+2, len, ROW_H-4);
      });
      let totBid=0, totAsk=0; levels.forEach(l=>{totBid+=l.bid; totAsk+=l.ask;});
      const delta = totAsk-totBid;
      ctx.textAlign='left'; ctx.font='bold 9px IBM Plex Mono';
      ctx.fillStyle = delta>=0?'#2fbf71':'#e8465c';
      ctx.fillText(`Δ${delta>=0?'+':''}${fmtShort(delta)}`, x, 11);
      ctx.font='8px IBM Plex Mono'; ctx.fillStyle='#4a5260'; ctx.textAlign='left';
      ctx.fillText(`V ${fmtShort(c.volume)}`, x, baseline-2);
      if(estimated){ ctx.fillStyle='#4a5260'; ctx.font='8px IBM Plex Mono'; ctx.textAlign='right'; ctx.fillText('≈', x+cw-4, 11); }
    }
  });

  if(state.lastPrice){
    const y=priceToY(state.lastPrice);
    ctx.strokeStyle='#ffa94d'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]);
    const label = fmt(state.lastPrice, dec);
    ctx.font='bold 11px IBM Plex Mono';
    const tw = ctx.measureText(label).width+14;
    ctx.fillStyle = '#ffa94d';
    ctx.fillRect(W-tw, y-9, tw, 18);
    ctx.fillStyle = '#1a1200'; ctx.textAlign='left';
    ctx.fillText(label, W-tw+7, y+4);
  }

  window._chartGeom = {startX, cw, priceToY, pMax, pMin, W, baseline};
  renderTimeAxis();
  drawCrosshairLines();
}

/* ── Crosshair estilo TradingView: líneas discontinuas + coordenadas exactas ── */
function drawCrosshairLines(){
  const g = window._chartGeom, pt = state.crosshairPt;
  if(!g || !pt || !state.crosshairOn) return;
  const {W, baseline} = g;
  if(pt.x<0 || pt.x>W || pt.y<PAD_TOP || pt.y>baseline) return;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.45)';
  ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,pt.y); ctx.lineTo(W,pt.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pt.x,PAD_TOP); ctx.lineTo(pt.x,baseline); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2);
  ctx.fillStyle='#ffffff'; ctx.fill();
  ctx.restore();
}

let _timeAxisPool = [];
function renderTimeAxis(){
  const axis = document.getElementById('timeAxis'); const g = window._chartGeom;
  if(!g){ _timeAxisPool.forEach(el=>el.style.display='none'); return; }
  const step = state.candleW<40?8:(state.candleW<70?5:3);
  let lastDateStr=null, used=0;
  const DAY_NAMES=['dom','lun','mar','mié','jué','vié','sáb'];
  state.candles.forEach((c,idx)=>{
    if(idx%step!==0) return;
    const x = g.startX+idx*g.cw; if(x<-30||x>g.W) return;
    const d = new Date(c.t);
    const dateStr = String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    const timeStr = d.toTimeString().slice(0,5);
    const showDate = dateStr!==lastDateStr;
    lastDateStr = dateStr;
    let el = _timeAxisPool[used];
    if(!el){
      el = document.createElement('div');
      el.style.position='absolute'; el.style.top='1px';
      el.style.fontFamily="'IBM Plex Mono',monospace"; el.style.textAlign='center';
      el.style.transform='translateX(-50%)'; el.style.lineHeight='1.05'; el.style.whiteSpace='nowrap';
      axis.appendChild(el);
      _timeAxisPool.push(el);
    }
    el.style.display='block';
    el.style.left = x+'px';
    if(showDate){
      el.style.color='#8b93a1'; el.style.fontSize='9px';
      el.innerHTML = `<div style="font-size:7px;color:#565e6b;margin-bottom:1px">${dateStr}</div>${timeStr}`;
    } else {
      el.style.color='#6b7480'; el.style.fontSize='9px';
      el.innerHTML = timeStr;
    }
    used++;
  });
  for(let i=used;i<_timeAxisPool.length;i++) _timeAxisPool[i].style.display='none';
}

/* ============ Paneo LIBRE en todas direcciones + zoom con dedos (2 ejes independientes) ============ */
/* Gestos estilo TradingView movil:
   - 1 dedo -> paneo libre (tiempo + precio) con deslizamiento por inercia al soltar.
   - 2 dedos -> pinch-zoom anclado exactamente al punto entre los dedos (el
     precio/vela que tienes debajo de los dedos se queda fijo mientras haces zoom),
     con el eje horizontal y vertical desacoplados (como TV: pellizco horizontal
     cambia velas visibles, vertical cambia escala de precio).
   - Doble tap -> restablece la vista (equivalente al boton "Restablecer vista").
   - El render se agrupa en requestAnimationFrame para que el dibujo vaya a la
     misma cadencia que el dedo y no se acumulen renders redundantes (evita
     el tiron/lag tipico en moviles de gama media). */
const pointers = new Map();
let dragStart=null, pinch=null;
let velX=0, velY=0, lastMoveT=0, lastMoveX=0, lastMoveY=0;
let inertiaRAF=null, renderQueued=false;
let lastTapT=0, lastTapX=0, lastTapY=0;

function dist2(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function scheduleRender(){
  if(renderQueued) return;
  renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false; render(); });
}
function stopInertia(){ if(inertiaRAF){ cancelAnimationFrame(inertiaRAF); inertiaRAF=null; } }
function runInertia(){
  const HALF_LIFE_MS=110; // tiempo en el que la velocidad cae a la mitad -> frenado natural
  const MIN_VEL=0.015;
  stopInertia();
  let last=performance.now();
  function step(now){
    const dt=Math.max(1, now-last); last=now;
    const decay=Math.pow(0.5, dt/HALF_LIFE_MS);
    if(Math.abs(velX)<MIN_VEL && Math.abs(velY)<MIN_VEL){ inertiaRAF=null; return; }
    const factor = window._chartGeom ? (window._chartGeom.pMax-window._chartGeom.pMin)/(wrap.clientHeight-22-PAD_TOP-8) : 0;
    state.offsetPx += velX*(dt/16.7);
    state.priceShift += velY*(dt/16.7)*factor;
    velX *= decay; velY *= decay;
    render();
    inertiaRAF = requestAnimationFrame(step);
  }
  inertiaRAF = requestAnimationFrame(step);
}

canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  stopInertia();
  if(pointers.size===1){
    dragStart = {x:e.clientX, y:e.clientY, offsetPx:state.offsetPx, priceShift:state.priceShift,
                 factor: window._chartGeom ? (window._chartGeom.pMax-window._chartGeom.pMin)/(wrap.clientHeight-22-PAD_TOP-8) : 0};
    velX=0; velY=0; lastMoveT=performance.now(); lastMoveX=e.clientX; lastMoveY=e.clientY;
    canvas.classList.add('grabbing');
  } else if(pointers.size===2){
    dragStart=null;
    const pts=[...pointers.values()];
    pinch = {
      prevDx: Math.abs(pts[0].x-pts[1].x)||1,
      prevDy: Math.abs(pts[0].y-pts[1].y)||1,
    };
  }
});
canvas.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)){ if(state.crosshairOn) showCrosshair(e); return; }
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size===2 && pinch){
    const pts=[...pointers.values()];
    const midX=(pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
    const dx=Math.abs(pts[0].x-pts[1].x)||1, dy=Math.abs(pts[0].y-pts[1].y)||1;

    // Punto de anclaje: qué vela/precio hay AHORA MISMO bajo los dedos, calculado
    // con el estado actual (no con el estado de cuando empezó el gesto). Esto evita
    // que el ancla se desincronice cuando el auto-encuadre vertical cambia al
    // entrar/salir velas de la vista durante el mismo gesto (causa del "salto loco").
    const gNow = computeGeometry(state.offsetPx, state.priceShift, state.priceScale, state.candleW);
    if(!gNow){ pinch.prevDx=dx; pinch.prevDy=dy; return; }
    const anchorIdx = (midX-gNow.startX)/gNow.cw;
    const anchorPrice = gNow.yToPrice(midY);

    // Deltas incrementales frame a frame (no acumulados desde el inicio del gesto),
    // con límite por frame para filtrar picos de ruido táctil.
    const clampRatio = r => Math.min(1.18, Math.max(0.85, r));
    const ratioX = clampRatio(dx/pinch.prevDx);
    const ratioY = clampRatio(dy/pinch.prevDy);

    const newCandleW = Math.min(170, Math.max(3, state.candleW*ratioX));
    const newPriceScale = Math.min(3.5, Math.max(0.25, state.priceScale/ratioY));

    // Ancla horizontal: la vela bajo el punto medio de los dedos no se mueve.
    const candles=state.candles, W=wrap.clientWidth;
    const totalWidth = candles.length*newCandleW, rightEdge=W-16;
    const startXNew = midX - anchorIdx*newCandleW;
    state.offsetPx = startXNew - rightEdge + totalWidth;

    // Ancla vertical: el precio bajo el punto medio de los dedos no se mueve.
    const g0 = computeGeometry(state.offsetPx, 0, newPriceScale, newCandleW);
    if(g0){
      const baseHalf=(g0.pMax-g0.pMin)/2, baseCenterBase=(g0.pMax+g0.pMin)/2;
      const pMaxWanted = anchorPrice + (midY-PAD_TOP)/(g0.baseline-PAD_TOP)*(2*baseHalf);
      state.priceShift = (pMaxWanted-baseHalf) - baseCenterBase;
    }
    state.candleW = newCandleW; state.priceScale = newPriceScale;
    pinch.prevDx = dx; pinch.prevDy = dy;
    scheduleRender(); return;
  }
  if(dragStart && pointers.size===1){
    state.offsetPx = dragStart.offsetPx + (e.clientX-dragStart.x);
    state.priceShift = dragStart.priceShift + (e.clientY-dragStart.y)*dragStart.factor;
    const now=performance.now(), dt=Math.max(1, now-lastMoveT);
    velX = (e.clientX-lastMoveX)/dt*16.7;
    velY = (e.clientY-lastMoveY)/dt*16.7;
    lastMoveT=now; lastMoveX=e.clientX; lastMoveY=e.clientY;
    scheduleRender();
  }
});
function endPointer(e){
  const wasSingleTap = pointers.size===1 && dragStart &&
    Math.hypot(e.clientX-dragStart.x, e.clientY-dragStart.y)<10;
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(pointers.size===1){
    const [p]=pointers.values();
    dragStart = {x:p.x, y:p.y, offsetPx:state.offsetPx, priceShift:state.priceShift,
                 factor: window._chartGeom ? (window._chartGeom.pMax-window._chartGeom.pMin)/(wrap.clientHeight-22-PAD_TOP-8) : 0};
  } else if(pointers.size===0){
    dragStart=null; canvas.classList.remove('grabbing');
    if(wasSingleTap){
      const now=performance.now();
      if(now-lastTapT<300 && Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<24){
        // Doble tap -> restablecer vista, igual que el boton "Restablecer vista"
        state.offsetPx=0; state.priceShift=0; state.priceScale=1; state.candleW=76;
        state.crosshairPt=null;
        document.getElementById('crosshairPrice').style.display='none';
        document.getElementById('crosshairTime').style.display='none';
        velX=0; velY=0; stopInertia(); render();
        lastTapT=0; return;
      }
      lastTapT=now; lastTapX=e.clientX; lastTapY=e.clientY;
      // Tap simple sobre el gráfico -> fija el crosshair ahí, con líneas
      // discontinuas y coordenadas exactas de precio/tiempo, como en TradingView.
      if(state.crosshairOn) showCrosshair(e);
    }
    if(Math.abs(velX)>0.3 || Math.abs(velY)>0.3) runInertia();
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  stopInertia();
  if(e.ctrlKey || e.shiftKey) state.priceScale = Math.min(3.5, Math.max(0.25, state.priceScale + (e.deltaY>0?0.08:-0.08)));
  else state.candleW = Math.min(170, Math.max(3, state.candleW + (e.deltaY>0?-6:6)));
  scheduleRender();
}, {passive:false});

function showCrosshair(e){
  const g = window._chartGeom; if(!g) return;
  const rect = canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  state.crosshairPt = {x,y};
  const price = g.pMax - (y-PAD_TOP)/(g.baseline-PAD_TOP)*(g.pMax-g.pMin);
  const cp=document.getElementById('crosshairPrice');
  cp.style.display='block'; cp.style.top=(y+40)+'px'; cp.textContent=price.toFixed(price<1?6:4);
  const idx=Math.round((x-g.startX)/g.cw); const c=state.candles[idx];
  const ct=document.getElementById('crosshairTime');
  if(c){
    const d=new Date(c.t);
    const dateStr=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    ct.style.display='block'; ct.style.left=x+'px'; ct.textContent=dateStr+' '+d.toTimeString().slice(0,8);
  } else ct.style.display='none';
  scheduleRender();
}

function buildLiqLevChips(){
  const wrap=document.getElementById('liqLevChips');
  if(!wrap) return;
  wrap.innerHTML='';
  LEVERAGE_TIERS.forEach(tier=>{
    const chip=document.createElement('div');
    chip.className='liq-chip'+(state.liqLevs.includes(tier.lev)?' active':'');
    chip.style.setProperty('--chip-color', tier.color);
    chip.style.setProperty('--chip-bg', tier.color+'22');
    chip.innerHTML=`<i></i>${tier.lev}x`;
    chip.addEventListener('click', ()=>{
      const idx=state.liqLevs.indexOf(tier.lev);
      if(idx>=0) state.liqLevs.splice(idx,1); else state.liqLevs.push(tier.lev);
      chip.classList.toggle('active');
      rebuildLiquidityModel();
      render();
    });
    wrap.appendChild(chip);
  });
}
buildLiqLevChips();
document.getElementById('btnLiq').addEventListener('click', e=>{
  state.liqPanelOpen=!state.liqPanelOpen;
  document.getElementById('liqPanel').classList.toggle('open', state.liqPanelOpen);
});
document.addEventListener('click', e=>{
  if(!state.liqPanelOpen) return;
  if(e.target.closest('#liqPanel') || e.target.closest('#btnLiq')) return;
  state.liqPanelOpen=false;
  document.getElementById('liqPanel').classList.remove('open');
});
const liqToggleEl = document.getElementById('liqToggle');
liqToggleEl.classList.toggle('on', state.liqOn);
liqToggleEl.addEventListener('click', ()=>{
  state.liqOn=!state.liqOn;
  liqToggleEl.classList.toggle('on', state.liqOn);
  rebuildLiquidityModel();
  render();
});
const liqThr=document.getElementById('liqThreshold'), liqThrVal=document.getElementById('liqThresholdVal');
liqThr.value=Math.round(state.liqThreshold*100);
liqThrVal.textContent=state.liqThreshold.toFixed(2);
liqThr.addEventListener('input', ()=>{
  state.liqThreshold=parseInt(liqThr.value)/100;
  liqThrVal.textContent=state.liqThreshold.toFixed(2);
  render();
});

setInterval(()=>{
  if(state.autoRefresh){
    state.countdown=(state.countdown||60)-1;
    if(state.countdown<=0){ refreshAll(); }
    else document.getElementById('autoLabel').textContent = state.countdown+'s';
  }
}, 1000);

resizeCanvas();
refreshAll();
connectWS();

}catch(err){
  document.getElementById('statusDot').className='status-dot err';
  console.error(err);
}
</script>
</body>
</html>
